# Coordinate system: Panda3D aspect2d
#
# aspect2d is a viewport-normalized coordinate space where:
#   Y always spans -1.0 to +1.0  (2.0 units = full window height)
#   X spans -(width/height) to +(width/height)  (proportional to aspect ratio)
#
# 1 unit = window_height / 2 pixels  (same scale on both axes — isotropic)
#
# At the configured 512×480 window:
#   1 unit = 240 pixels
#   X spans -1.067 to +1.067  (= ±512/480)
#   Y spans -1.0   to +1.0
#
# To rescale the game, change window.width and window.height.
# All viewport-unit values below remain valid as long as aspect ratio stays close to 1.067.

window:
  width: 1024    # pixels (512 = 2× NES horizontal: 256×2)
  height: 960   # pixels (480 = 2× NES vertical: 240×2)
  # 1 unit = 240 pixels at this resolution
  # X bounds: ±1.067,  Y bounds: ±1.0

player:
  health: 3           # hit points per life
  lives: 3            # starting lives
  scale: 0.40         # Transform scale at spawn (1.0 was huge). Combined with render base_scale=0.5
                      # and ship.egg normalization this yields a reasonable fighter footprint.
  collider_scale_factor: 0.70 # Fraction of *visual* size used for the hitbox rect (see sprite_visual_size.py).
                              # 0.65-0.75 is typical for "bound to visible sprite" while keeping NES-era fairness.
  speed: 1.2          # horizontal movement speed (units/sec; 288 px/sec at 512×480)
  vertical_speed: 1.2 # vertical movement speed (units/sec)
  x_limit: 0.95       # distance from center to left/right wall (units; viewport X = ±1.067)
  y_min: -0.88        # bottom movement boundary (units; viewport Y = -1.0)
  y_max: 0.75         # top movement boundary (units; leaves ~60px for HUD)
  fire_rate: 0.4      # minimum delay between shots (seconds)
  max_shots: 5        # maximum simultaneous projectiles on screen
  invulnerable_duration: 1.5  # post-hit invulnerability duration (seconds)

bullet:
  speed: 0.5    # projectile speed (units/sec; 480 px/sec at 512×480)
  lifetime: 2.0 # seconds before auto-despawn
  scale: 0.25              # Transform scale for bullets (hardcoded 0.3 before).
  collider_scale_factor: 0.60  # Tight-ish hitbox relative to the tall thin bullet visual.

spawner:
  interval: 1.5          # base time between spawns (seconds)
  max_enemies: 4         # starting concurrent enemy cap
  spawn_y: 1.1           # Y position enemies spawn at (units, just above top edge)
  despawn_y: -1.1        # Y position enemies are removed at (units, just below bottom edge)
  enemy_x_range: 0.9     # enemies spawn at random X in [-range, +range] (units)
  difficulty_ramp_interval: 20.0  # seconds between difficulty steps
  difficulty_speed_delta: 0.08    # speed multiplier increase per step (unitless)
  difficulty_spawn_delta: -0.15   # spawn interval reduction per step (seconds; clamped at 0.5)
  difficulty_max_enemies_cap: 8   # maximum concurrent enemies at peak difficulty

enemies:
  scale: 0.22         # Transform scale (was 0.3 or 0.8). Tuned relative to player so the ship is the
                      # dominant but not "huge" element. Use sprite_visual_size helper for derivation.
  collider_scale_factor: 0.80  # Fraction of the asteroid's computed visual size for its hitbox.
  collider_size: 0.18 # (legacy fallback; now overridden by scale * factor via the visual size helper)
  patterns:
    # Names come from engine.patterns.shmup. Rates are aspect2d units per second.
    # Difficulty multiplies descent and frequency. Amplitude and radius stay fixed.
    - name: straight
      weight: 4
      point_value: 100
      descent: 0.45
    - name: sinusoidal
      weight: 2
      point_value: 150
      amplitude: 0.25
      frequency: 0.8
      descent: 0.35
    - name: circular
      weight: 1
      point_value: 180
      radius: 0.18
      frequency: 0.5
      descent: 0.25
    - name: figure_eight
      weight: 1
      point_value: 200
      amplitude: 0.22
      frequency: 0.6
      descent: 0.30
    - name: zigzag
      weight: 1
      point_value: 160
      amplitude: 0.28
      frequency: 2.5
      descent: 0.40

starfield:
  enabled: true
  layer_1_count: 60
  layer_1_speed: 0.08
  layer_2_count: 35
  layer_2_speed: 0.22
