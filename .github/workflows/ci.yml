name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Unit tests run headless (they use MockShowBase, no display required).
      # Integration/graphics tests need a render context and are added once
      # headless rendering (xvfb / Panda3D offscreen) is wired up.
      - name: Run unit tests
        run: pytest tests/unit -m "not slow"

  lint:
    name: lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Blocking: real-bug checks only (syntax errors, undefined names).
      - name: flake8 (critical — blocking)
        run: flake8 engine tools main.py --select=E9,F63,F7,F82 --show-source --statistics
      # Informational: the codebase predates CI, so style/type gates start
      # non-blocking and are tightened incrementally.
      - name: flake8 (full — informational)
        run: flake8 engine tools main.py --exit-zero --max-line-length=100 --statistics
      - name: black --check (informational)
        run: black --check engine tools main.py
        continue-on-error: true
      - name: mypy (informational)
        run: mypy engine
        continue-on-error: true
