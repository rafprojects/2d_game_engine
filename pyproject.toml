[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py2d-game-engine"
version = "0.1.0"
description = "A versatile 2D game engine built with Python and Panda3D using ECS architecture"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["game", "engine", "2d", "ecs", "panda3d", "gamedev"]
dependencies = [
    "panda3d>=1.10.14",
    "jsonschema>=4.0.0",
    "msgpack>=1.0.0",
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=5.0",
    "mypy>=1.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=0.18",
]
examples = [
    "pillow>=9.0",  # For sprite sheet creation
]

[project.urls]
Homepage = "https://github.com/yourusername/py2d-game-engine"
Documentation = "https://py2d-game-engine.readthedocs.io/"
Repository = "https://github.com/yourusername/py2d-game-engine.git"
"Bug Tracker" = "https://github.com/yourusername/py2d-game-engine/issues"

[project.scripts]
py2d-engine = "tools.cli.project_gen:main"
py2d-assets = "tools.cli.asset_tools:main"
py2d-build = "tools.cli.build_tools:main"
py2d-dev = "tools.cli.dev_setup:main"
py2d-cartridge = "tools.cli.cartridge_pack:main"

[tool.setuptools.packages.find]
include = ["engine*", "tools*", "examples*"]
exclude = ["tests*", "temp*", "docs*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.yml", "*.yaml"]

# Testing configuration
[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "benchmark: marks tests as performance benchmarks",
]

# Code formatting
[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | temp
)/
'''

# Type checking
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "panda3d.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "direct.*"
ignore_missing_imports = true
